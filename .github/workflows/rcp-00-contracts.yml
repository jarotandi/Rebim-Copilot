name: RCP-00 Contracts

on:
  push:
    branches:
      - rcp-00-contract-freeze
  pull_request:
    branches:
      - main

jobs:
  contract-gate:
    name: Contract freeze gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Contract and baseline tests
        run: npm test
