name: RCP-00R Baseline

on:
  push:
    branches:
      - rcp-00r-baseline-recovery
  pull_request:
    branches:
      - main

jobs:
  gateway-baseline:
    name: Gateway build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build

      - name: Baseline tests
        run: npm test
